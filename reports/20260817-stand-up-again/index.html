<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>短视频 · 允许停下来</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@900&family=Plus+Jakarta+Sans:wght@800;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        }

        /* 纯净 9:16 短视频视口 */
        .reel-canvas {
            width: 100%;
            max-width: 440px;
            aspect-ratio: 9 / 16;
            max-height: 100vh;
            position: relative;
            overflow: hidden;
            background: #111;
            box-shadow: 0 0 40px rgba(0,0,0,0.8);
        }

        /* 背景层：真实唯美场景 + 慢速推镜（Ken Burns Effect） */
        .bg-layer {
            position: absolute;
            inset: -10%;
            width: 120%;
            height: 120%;
            background-size: cover;
            background-position: center;
            opacity: 0;
            transition: opacity 1s ease-in-out;
            transform: scale(1);
            filter: brightness(0.82) contrast(1.05);
        }

        .bg-layer.active {
            opacity: 1;
            animation: slowZoom 14s ease-out forwards;
        }

        @keyframes slowZoom {
            0% { transform: scale(1) translateY(0); }
            100% { transform: scale(1.1) translateY(-2%); }
        }

        /* 电影级微暗角遮罩，保证文字极度清晰 */
        .vignette-overlay {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 50%, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.45) 80%, rgba(0,0,0,0.7) 100%);
            z-index: 2;
            pointer-events: none;
        }

        /* 舞台居中区：动态花字与核心视觉冲击 */
        .stage-center {
            position: absolute;
            inset: 0;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 0 24px;
            text-align: center;
            pointer-events: none;
        }

        /* 爆款卡点动态大花字 */
        .hook-big-badge {
            font-family: 'Noto Serif SC', serif;
            font-size: 38px;
            font-weight: 900;
            color: #ffffff;
            line-height: 1.25;
            letter-spacing: -0.02em;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.8), 0 1px 4px rgba(0,0,0,0.9);
            transform: scale(0.85);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            margin-bottom: 20px;
        }

        .hook-big-badge.show {
            transform: scale(1);
            opacity: 1;
        }

        /* 醒目的高光黄色贴纸底色 */
        .highlight-sticker {
            background: #ffcc00;
            color: #111111;
            padding: 2px 10px;
            border-radius: 8px;
            display: inline-block;
            box-shadow: 0 6px 16px rgba(0,0,0,0.4);
            transform: rotate(-2deg);
        }

        /* 底部动态逐句对齐字幕（抖音同款黑框/黄字高光） */
        .subtitle-anchor {
            position: absolute;
            bottom: 12%;
            left: 0;
            right: 0;
            z-index: 20;
            display: flex;
            justify-content: center;
            padding: 0 20px;
            pointer-events: none;
        }

        .tiktok-caption {
            background: rgba(0, 0, 0, 0.72);
            backdrop-filter: blur(8px);
            border: 1.5px solid rgba(255, 255, 255, 0.15);
            color: #ffffff;
            font-size: 19px;
            font-weight: 900;
            line-height: 1.45;
            padding: 10px 20px;
            border-radius: 9999px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
            letter-spacing: 0.02em;
            text-align: center;
            max-width: 90%;
            transform: translateY(10px);
            opacity: 0;
            transition: all 0.25s cubic-bezier(0.2, 0.9, 0.3, 1.2);
        }

        .tiktok-caption.active {
            transform: translateY(0);
            opacity: 1;
        }

        .tiktok-caption span.word-pop {
            color: #ffcc00;
            display: inline-block;
            transform: scale(1.1);
        }

        /* 纯净点击遮罩层（仅在未播放前出现，一点击彻底销毁） */
        .clean-touch-curtain {
            position: absolute;
            inset: 0;
            z-index: 50;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(10px);
            cursor: pointer;
            gap: 16px;
            transition: opacity 0.35s ease;
        }

        .play-ring {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: #ffcc00;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 35px rgba(255, 204, 0, 0.6);
            animation: pulseTap 1.8s infinite;
        }

        @keyframes pulseTap {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .curtain-text {
            font-size: 15px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 0.05em;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>
    <div class="reel-canvas" onclick="handleTap()">
        <!-- 镜头背景切换（Ken Burns 慢速推镜） -->
        <div id="bg-1" class="bg-layer active" style="background-image: url('bg_scene1.jpg');"></div>
        <div id="bg-2" class="bg-layer" style="background-image: url('bg_scene2.jpg');"></div>
        <div id="bg-3" class="bg-layer" style="background-image: url('bg_scene3.jpg');"></div>

        <div class="vignette-overlay"></div>

        <!-- 音频源（晓晓高共情配音） -->
        <audio id="main-audio" src="audio_xiaoxiao.mp3" preload="auto"></audio>

        <!-- 初始全屏点击即播（无任何多余UI） -->
        <div id="touch-curtain" class="clean-touch-curtain">
            <div class="play-ring">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="#111"><polygon points="6 3 20 12 6 21 6 3"></polygon></svg>
            </div>
            <div class="curtain-text">轻触屏幕 · 播放短视频</div>
        </div>

        <!-- 中部动态大花字（随剧情卡点爆发） -->
        <div class="stage-center">
            <div id="hook-title" class="hook-big-badge show">
                离开工位<br>努力<span class="highlight-sticker">全白费了吗？</span>
            </div>
        </div>

        <!-- 底部抖音同款胶囊字幕条 -->
        <div class="subtitle-anchor">
            <div id="caption-box" class="tiktok-caption active">
                离开工位的那一刻，很多人会陷入深深的怀疑...
            </div>
        </div>
    </div>

    <script>
        const audio = document.getElementById('main-audio');
        const curtain = document.getElementById('touch-curtain');
        const hookTitle = document.getElementById('hook-title');
        const captionBox = document.getElementById('caption-box');

        // 精准分镜与动态大花字对照表（按文案剧情彻底异构）
        const timeline = [
            { 
                start: 0.1, end: 7.9, 
                text: "离开工位的那一刻，很多人会陷入深深的怀疑：“过去这些年的努力，全白费了吗？”", 
                bg: 1, 
                hookHtml: '离开工位<br>努力<span class="highlight-sticker">全白费了吗？</span>' 
            },
            { 
                start: 7.9, end: 12.1, 
                text: "其实不是你不行，只是流水线把人拆成了零件。", 
                bg: 1, 
                hookHtml: '不是你不行<br><span class="highlight-sticker">系统把人拆碎了</span>' 
            },
            { 
                start: 12.1, end: 22.9, 
                text: "平台带走的只是一张工牌，那些你真正熬过的难题与韧性，全部长在你自己的骨头里。", 
                bg: 1, 
                hookHtml: '平台带走的只是工牌<br>韧性长在<span class="highlight-sticker">你的骨头里</span>' 
            },
            { 
                start: 22.9, end: 34.3, 
                text: "如果你正处在空窗期，明天早晨醒来，试着做好这三件具体的小事：", 
                bg: 2, 
                hookHtml: '空窗期自救<br><span class="highlight-sticker">做好这 3 件事</span>' 
            },
            { 
                start: 34.3, end: 43.6, 
                text: "第一件事：给能力做一次“彻底脱水”，删掉大厂黑话，只写脱离平台后能独立解决的真实问题。", 
                bg: 2, 
                hookHtml: '第 1 步<br>能力<span class="highlight-sticker">彻底脱水</span>' 
            },
            { 
                start: 43.6, end: 58.7, 
                text: "第二件事：去做一个属于你自己的“微型交付物”，重新找回直接创造价值的掌控感。", 
                bg: 2, 
                hookHtml: '第 2 步<br>做个<span class="highlight-sticker">微型个人交付物</span>' 
            },
            { 
                start: 58.7, end: 72.9, 
                text: "第三件事：给生活开启“低能耗模式”，砍掉面子消费，当你不再恐慌，才能做出清醒的选择。", 
                bg: 3, 
                hookHtml: '第 3 步<br>开启<span class="highlight-sticker">低能耗模式</span>' 
            },
            { 
                start: 72.9, end: 83.6, 
                text: "把原本用来应付内耗的才华，从今天开始，全部拿来投资你自己。", 
                bg: 3, 
                hookHtml: '拿回时间所有权<br><span class="highlight-sticker">投资你自己</span>' 
            }
        ];

        let currentBgId = 1;
        let lastHookText = '';

        function handleTap() {
            if (curtain.style.display !== 'none') {
                curtain.style.opacity = '0';
                setTimeout(() => { curtain.style.display = 'none'; }, 300);
                audio.play();
            } else {
                if (audio.paused) {
                    audio.play();
                } else {
                    audio.pause();
                }
            }
        }

        audio.addEventListener('timeupdate', () => {
            const cur = audio.currentTime;
            const matched = timeline.find(item => cur >= item.start && cur < item.end);
            
            if (matched) {
                // 更新底部抖音胶囊字幕
                captionBox.innerText = matched.text;
                captionBox.classList.add('active');

                // 更新中部爆款大花字
                if (lastHookText !== matched.hookHtml) {
                    lastHookText = matched.hookHtml;
                    hookTitle.classList.remove('show');
                    setTimeout(() => {
                        hookTitle.innerHTML = matched.hookHtml;
                        hookTitle.classList.add('show');
                    }, 150);
                }

                // 切换背景与镜头推拉
                if (matched.bg !== currentBgId) {
                    switchBg(matched.bg);
                }
            }
        });

        function switchBg(bgId) {
            currentBgId = bgId;
            for (let i = 1; i <= 3; i++) {
                const el = document.getElementById(`bg-${i}`);
                if (el) {
                    el.classList.toggle('active', i === bgId);
                }
            }
        }
    </script>
</body>
</html>
