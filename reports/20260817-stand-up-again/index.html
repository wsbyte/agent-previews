<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>你的焦虑，99%都是别人塞给你的</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@900&display=swap');
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }

        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
            overflow: hidden;
        }

        .reel {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            max-width: 500px;
            position: relative;
            overflow: hidden;
            background: #0a0a0a;
            cursor: pointer;
        }

        @media (min-aspect-ratio: 9/16) {
            .reel { max-width: 500px; height: 100vh; aspect-ratio: 9/16; }
        }

        /* === 全屏背景镜头层 === */
        .shot { position: absolute; inset: -8%; width: 116%; height: 116%; background-size: cover; background-position: center; opacity: 0; transition: opacity 1.2s ease; will-change: transform, opacity; }
        .shot.live { opacity: 1; }
        .shot.zoom-in { animation: kenIn 16s ease-out forwards; }
        .shot.zoom-out { animation: kenOut 16s ease-out forwards; }
        .shot.pan-up { animation: panUp 16s ease-out forwards; }
        .shot.pan-right { animation: panRight 16s ease-out forwards; }
        @keyframes kenIn { from { transform: scale(1); } to { transform: scale(1.15); } }
        @keyframes kenOut { from { transform: scale(1.12); } to { transform: scale(1); } }
        @keyframes panUp { from { transform: translateY(3%); } to { transform: translateY(-3%); } }
        @keyframes panRight { from { transform: translateX(-3%); } to { transform: translateX(3%); } }

        /* 电影暗角 */
        .vig { position: absolute; inset: 0; z-index: 2; pointer-events: none;
            background: radial-gradient(ellipse at 50% 50%, transparent 40%, rgba(0,0,0,0.55) 100%); }

        /* === 中屏动态冲击大字 === */
        .center-stage { position: absolute; inset: 0; z-index: 10; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 0 28px; text-align: center; pointer-events: none; }

        .big-word {
            font-family: 'Noto Serif SC', serif;
            font-size: clamp(28px, 7.5vw, 42px);
            font-weight: 900;
            color: #fff;
            line-height: 1.3;
            text-shadow: 0 3px 18px rgba(0,0,0,0.9), 0 1px 3px rgba(0,0,0,0.95);
            opacity: 0;
            transform: scale(0.8) translateY(12px);
            transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .big-word.pop { opacity: 1; transform: scale(1) translateY(0); }

        /* 高亮贴纸 */
        .hl { display: inline; padding: 1px 8px; border-radius: 6px; }
        .hl-yellow { background: #ffcc00; color: #111; box-shadow: 0 4px 12px rgba(255,204,0,0.5); }
        .hl-white { background: rgba(255,255,255,0.95); color: #111; box-shadow: 0 4px 12px rgba(255,255,255,0.4); }
        .hl-rose { background: #ff6b6b; color: #fff; box-shadow: 0 4px 12px rgba(255,107,107,0.5); }

        /* === 底部抖音胶囊字幕 === */
        .cap-dock { position: absolute; bottom: 10%; left: 0; right: 0; z-index: 20; display: flex; justify-content: center; padding: 0 16px; pointer-events: none; }

        .cap-pill {
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
            color: #fff;
            font-size: clamp(14px, 4vw, 18px);
            font-weight: 800;
            line-height: 1.5;
            padding: 10px 20px;
            border-radius: 20px;
            text-align: center;
            max-width: 92%;
            box-shadow: 0 6px 20px rgba(0,0,0,0.5);
            opacity: 0;
            transform: translateY(8px);
            transition: all 0.2s ease-out;
        }
        .cap-pill.on { opacity: 1; transform: translateY(0); }
        .cap-pill .kw { color: #ffcc00; }

        /* === 初始轻触遮罩 === */
        .tap-mask { position: absolute; inset: 0; z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: rgba(0,0,0,0.5); backdrop-filter: blur(8px); transition: opacity 0.3s; }
        .tap-ring { width: 68px; height: 68px; border-radius: 50%; background: #ffcc00; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 30px rgba(255,204,0,0.5); animation: pulse 1.8s infinite; }
        @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.1); } }
        .tap-label { font-size: 14px; font-weight: 800; color: #fff; text-shadow: 0 2px 8px rgba(0,0,0,0.8); letter-spacing: 0.05em; }
    </style>
</head>
<body>
<div class="reel" id="reel" onclick="handleTap()">
    <!-- 4 个全屏镜头背景 -->
    <div id="s1" class="shot live zoom-in" style="background-image:url('bg_rain.jpg')"></div>
    <div id="s2" class="shot pan-up" style="background-image:url('bg_scene1.jpg')"></div>
    <div id="s3" class="shot zoom-out" style="background-image:url('bg_scene2.jpg')"></div>
    <div id="s4" class="shot pan-right" style="background-image:url('bg_scene3.jpg')"></div>
    <div class="vig"></div>

    <audio id="vo" src="audio_with_bgm.mp3" preload="auto"></audio>

    <!-- 初始轻触播放 -->
    <div id="mask" class="tap-mask">
        <div class="tap-ring"><svg width="28" height="28" viewBox="0 0 24 24" fill="#111"><polygon points="6 3 20 12 6 21"/></svg></div>
        <div class="tap-label">轻触播放</div>
    </div>

    <!-- 中屏爆款大字 -->
    <div class="center-stage">
        <div id="bw" class="big-word pop">你大部分的焦虑<br>其实<span class="hl hl-yellow">都不是你自己的</span></div>
    </div>

    <!-- 底部字幕 -->
    <div class="cap-dock">
        <div id="cap" class="cap-pill on">你有没有发现，你大部分的焦虑，其实都不是你自己的？</div>
    </div>
</div>

<script>
const vo = document.getElementById('vo'), mask = document.getElementById('mask'),
      bw = document.getElementById('bw'), cap = document.getElementById('cap');
let curShot = 1, lastBig = '';

// 精准VTT时间轴 + 分镜 + 爆款大字
const T = [
  { s:0.1, e:4.5, cap:"你有没有发现，你大部分的焦虑，其实都不是你自己的？", shot:1,
    big:'你大部分的焦虑<br>其实<span class="hl hl-yellow">都不是你自己的</span>' },
  { s:4.5, e:10.6, cap:"25岁焦虑没有存款，30岁焦虑没有房子，35岁焦虑被优化。", shot:1,
    big:'25岁存款 30岁房子 35岁优化<br><span class="hl hl-rose">这些焦虑是谁定的？</span>' },
  { s:10.6, e:15.0, cap:"这些焦虑的时间表，是谁定的？不是你定的。", shot:1,
    big:'<span class="hl hl-white">不是你定的</span>' },
  { s:15.0, e:22.7, cap:"是朋友圈，是父母的催促，是职场的潜规则，是整个社会告诉你应该拥有什么。", shot:1,
    big:'朋友圈 · 催促 · 潜规则<br>社会告诉你<span class="hl hl-yellow">应该拥有什么</span>' },
  { s:22.7, e:28.8, cap:"但你有没有想过，去掉这些外界的声音，你自己，真正害怕的是什么？", shot:2,
    big:'去掉外界的声音<br>你<span class="hl hl-white">真正害怕的</span>是什么？' },
  { s:28.8, e:37.3, cap:"大多数人想到最后会发现，自己真正怕的，不是没钱没房，而是这辈子从来没有为自己认真活过一次。", shot:2,
    big:'真正怕的不是没钱没房<br>而是<span class="hl hl-rose">从未为自己活过</span>' },
  { s:37.3, e:45.3, cap:"所以试着做一件小事：打开备忘录，写下3个‘如果不考虑别人眼光，我最想做的事’。", shot:3,
    big:'打开备忘录 写下<br><span class="hl hl-yellow">3 个最想做的事</span>' },
  { s:45.3, e:51.1, cap:"不用宏大，不用完美，哪怕是学画画、开个小店、去大理住一个月。", shot:3,
    big:'学画画 · 开个小店<br><span class="hl hl-white">去大理住一个月</span>' },
  { s:51.1, e:60.2, cap:"然后从最容易的那个开始，这周就迈出第一步。哪怕只是搜索一下、报个体验课。", shot:3,
    big:'这周就<span class="hl hl-yellow">迈出第一步</span>' },
  { s:60.2, e:69.3, cap:"焦虑的反义词不是平静，是行动。当你开始为自己做选择，不属于你的焦虑会自动消失。", shot:4,
    big:'焦虑的反义词<br>不是平静 是<span class="hl hl-rose">行动</span>' },
  { s:69.3, e:74.8, cap:"你的人生不需要跑赢任何人。你只需要，配得上自己的时间。", shot:4,
    big:'你只需要<br><span class="hl hl-yellow">配得上自己的时间</span>' },
];

function handleTap() {
    if (mask.style.display !== 'none') {
        mask.style.opacity = '0';
        setTimeout(() => { mask.style.display = 'none'; }, 300);
        vo.play();
    } else {
        vo.paused ? vo.play() : vo.pause();
    }
}

vo.addEventListener('timeupdate', () => {
    const t = vo.currentTime;
    const m = T.find(x => t >= x.s && t < x.e);
    if (!m) return;

    // 字幕
    cap.innerHTML = m.cap;
    cap.classList.add('on');

    // 爆款大字卡点弹出
    if (m.big !== lastBig) {
        lastBig = m.big;
        bw.classList.remove('pop');
        void bw.offsetWidth; // force reflow
        bw.innerHTML = m.big;
        bw.classList.add('pop');
    }

    // 镜头切换
    if (m.shot !== curShot) {
        curShot = m.shot;
        document.querySelectorAll('.shot').forEach((el, i) => {
            el.classList.toggle('live', i + 1 === curShot);
        });
    }
});
</script>
</body>
</html>
