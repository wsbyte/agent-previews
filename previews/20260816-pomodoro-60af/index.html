<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>沉浸式番茄钟 - Focus Timer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @keyframes pulse-subtle {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.92; transform: scale(1.02); }
    }
    .timer-glow {
      box-shadow: 0 0 50px rgba(59, 130, 246, 0.25);
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-between p-6 select-none font-sans">
  <!-- 顶栏 -->
  <header class="w-full max-w-sm flex items-center justify-between pt-2">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-lg bg-blue-500/20 text-blue-400 flex items-center justify-center font-bold">
        <i class="fa-solid fa-stopwatch"></i>
      </div>
      <span class="font-semibold tracking-wide text-sm">Focus Space</span>
    </div>
    <div class="text-xs bg-slate-800/80 px-3 py-1.5 rounded-full text-slate-400 border border-slate-700/50">
      🎯 保持专注
    </div>
  </header>

  <!-- 核心计时器主体 -->
  <main class="flex flex-col items-center justify-center my-auto w-full max-w-sm">
    <div class="relative w-64 h-64 rounded-full border-4 border-slate-800 flex flex-col items-center justify-center timer-glow bg-slate-900/60 backdrop-blur-md">
      <div id="mode-label" class="text-xs font-semibold text-blue-400 uppercase tracking-widest mb-2">深度专注</div>
      <div id="time-display" class="text-5xl font-mono font-bold tracking-tighter text-white">25:00</div>
      <div id="status-desc" class="text-xs text-slate-500 mt-2">点击开始专注</div>
    </div>

    <!-- 模式选择 -->
    <div class="flex items-center gap-2 mt-8 bg-slate-900 p-1.5 rounded-2xl border border-slate-800/80">
      <button onclick="setMode('work', 25)" class="mode-btn px-4 py-2 rounded-xl text-xs font-medium bg-blue-600 text-white transition-all">25m 专注</button>
      <button onclick="setMode('shortBreak', 5)" class="mode-btn px-4 py-2 rounded-xl text-xs font-medium text-slate-400 hover:text-white transition-all">5m 短休</button>
      <button onclick="setMode('longBreak', 15)" class="mode-btn px-4 py-2 rounded-xl text-xs font-medium text-slate-400 hover:text-white transition-all">15m 长休</button>
    </div>

    <!-- 操作按钮 -->
    <div class="flex items-center gap-4 mt-8">
      <button id="start-btn" onclick="toggleTimer()" class="w-16 h-16 rounded-2xl bg-blue-600 hover:bg-blue-500 text-white flex items-center justify-center text-xl shadow-lg shadow-blue-500/25 active:scale-95 transition-all">
        <i id="start-icon" class="fa-solid fa-play ml-0.5"></i>
      </button>
      <button onclick="resetTimer()" class="w-12 h-12 rounded-2xl bg-slate-800 hover:bg-slate-700 text-slate-300 flex items-center justify-center text-base border border-slate-700 active:scale-95 transition-all">
        <i class="fa-solid fa-rotate-right"></i>
      </button>
    </div>
  </main>

  <!-- 底部说明 -->
  <footer class="text-center text-xs text-slate-600 pb-2">
    Designed for Mobile • Single-File CDN App
  </footer>

  <script>
    let totalSeconds = 25 * 60;
    let currentSeconds = totalSeconds;
    let timerId = null;
    let currentMode = 'work';

    const timeDisplay = document.getElementById('time-display');
    const startBtn = document.getElementById('start-btn');
    const startIcon = document.getElementById('start-icon');
    const modeLabel = document.getElementById('mode-label');
    const statusDesc = document.getElementById('status-desc');

    function updateDisplay() {
      const minutes = Math.floor(currentSeconds / 60);
      const seconds = currentSeconds % 60;
      timeDisplay.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
    }

    function toggleTimer() {
      if (timerId) {
        clearInterval(timerId);
        timerId = null;
        startIcon.className = "fa-solid fa-play ml-0.5";
        statusDesc.textContent = "已暂停";
      } else {
        startIcon.className = "fa-solid fa-pause";
        statusDesc.textContent = "专注进行中...";
        timerId = setInterval(() => {
          if (currentSeconds > 0) {
            currentSeconds--;
            updateDisplay();
          } else {
            clearInterval(timerId);
            timerId = null;
            startIcon.className = "fa-solid fa-play ml-0.5";
            statusDesc.textContent = "🎉 阶段完成！";
            alert("⏰ 时间到！恭喜完成专注！");
          }
        }, 1000);
      }
    }

    function resetTimer() {
      if (timerId) {
        clearInterval(timerId);
        timerId = null;
        startIcon.className = "fa-solid fa-play ml-0.5";
      }
      currentSeconds = totalSeconds;
      statusDesc.textContent = "点击开始专注";
      updateDisplay();
    }

    function setMode(mode, mins) {
      currentMode = mode;
      totalSeconds = mins * 60;
      
      const buttons = document.querySelectorAll('.mode-btn');
      buttons.forEach(btn => {
        btn.className = "mode-btn px-4 py-2 rounded-xl text-xs font-medium text-slate-400 hover:text-white transition-all";
      });
      event.target.className = "mode-btn px-4 py-2 rounded-xl text-xs font-medium bg-blue-600 text-white transition-all";

      if (mode === 'work') modeLabel.textContent = "深度专注";
      else if (mode === 'shortBreak') modeLabel.textContent = "短时间休息";
      else modeLabel.textContent = "长时间放松";

      resetTimer();
    }

    updateDisplay();
  </script>
</body>
</html>
